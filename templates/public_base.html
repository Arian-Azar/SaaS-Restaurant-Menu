<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}منوی دیجیتال{% endblock %}</title>
    {% block meta %}{% endblock %}
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f9fafb;
            margin: 0;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-wrapper { max-width: 680px; margin: 0 auto; padding-bottom: 40px; }

        /* هیرو */
        .hero {
            position: relative;
            min-height: 260px;
            background: #111827 center/cover no-repeat;
            display: flex;
            align-items: flex-end;
            color: #fff;
        }
        .hero::before {
            content: '';
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.75), rgba(0,0,0,0.25));
        }
        .hero-content { position: relative; padding: 24px 20px; z-index: 1; }
        .hero-content .subtitle { color: #f0c987; font-size: 13px; display: block; margin-bottom: 4px; }
        .hero-content h1 { margin: 0; font-size: 24px; }

        .restaurant-header {
            padding: 16px 20px 18px;
            background: #fff;
            border-radius: 16px 16px 0 0;
            margin-top: -18px;
            position: relative;
        }
        .restaurant-header .meta { color: #6b7280; font-size: 13px; margin: 4px 0; }
        .restaurant-header .meta a { color: inherit; text-decoration: none; }

        /* بخش‌های عمومی */
        .section { padding: 24px 20px; }
        .section-title { font-size: 18px; font-weight: 700; margin: 0 0 14px; display: flex; align-items: center; gap: 8px; }
        .section-title .tag { color: #c8935f; font-size: 12px; font-weight: 400; }
        .bg-alt { background: #f3f4f6; }

        /* اسکرول افقی مشترک (گالری/غذای پیشنهادی/تیم) */
        .h-scroll { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
        .h-scroll::-webkit-scrollbar { display: none; }
        .h-scroll img, .h-scroll .ph-img {
            width: 130px; height: 100px; object-fit: cover; border-radius: 10px; flex-shrink: 0;
        }
        .h-card { flex-shrink: 0; width: 140px; text-align: center; }
        .h-card .name { font-size: 13px; font-weight: 600; margin-top: 6px; }
        .h-card .sub { font-size: 12px; color: #6b7280; }

        /* ناوبری چسبان دسته‌بندی */
        .category-nav {
            position: sticky; top: 0; z-index: 10;
            background: #fff;
            display: flex; gap: 8px; overflow-x: auto;
            padding: 10px 20px; border-bottom: 1px solid #f1f5f9;
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-nav a {
            flex-shrink: 0; padding: 6px 14px; background: #f3f4f6; border-radius: 999px;
            color: #374151; text-decoration: none; font-size: 13px; white-space: nowrap;
        }
        .category-block { padding: 20px; scroll-margin-top: 56px; }

        /* آمار */
        .stats-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; text-align: center; }
        .stat-box { background: #fff; border-radius: 10px; padding: 16px 8px; border: 1px solid #eee; }
        .stat-box strong { display: block; font-size: 22px; color: #b45309; }
        .stat-box span { font-size: 12px; color: #6b7280; }

        /* کارت محصول */
        .product-card {
            display: flex; align-items: center; gap: 12px;
            padding: 12px 0; border-bottom: 1px solid #f1f5f9;
            text-decoration: none; color: inherit;
        }
        .product-thumb { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; flex-shrink: 0; }
        .product-name { font-weight: 600; font-size: 15px; }
        .product-desc { color: #6b7280; font-size: 13px; margin-top: 2px; }
        .product-price { white-space: nowrap; font-weight: 700; font-size: 14px; }
        .product-price .original { color: #9ca3af; text-decoration: line-through; font-weight: 400; font-size: 12px; margin-left: 6px; }

        /* تیم */
        .team-card img, .team-card .ph-img { width: 90px; height: 90px; border-radius: 50%; object-fit: cover; }

        /* نظرات */
        .testimonial-card {
            background: #fff; border: 1px solid #eee; border-radius: 10px;
            padding: 16px; margin-bottom: 12px;
        }
        .testimonial-card .stars { color: #f0b429; font-size: 13px; }
        .testimonial-card .name { font-weight: 600; font-size: 13px; margin-top: 6px; }

        /* وبلاگ */
        .blog-card { display: block; text-decoration: none; color: inherit; margin-bottom: 16px; }
        .blog-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 10px; }
        .blog-card .title { font-weight: 700; margin-top: 8px; font-size: 15px; }
        .blog-card .date { color: #9ca3af; font-size: 12px; }

        /* فرم رزرو */
        .reserve-form label { display: block; font-size: 13px; margin: 10px 0 4px; }
        .reserve-form input, .reserve-form textarea {
            width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 14px; font-family: inherit;
        }
        .btn { display: inline-block; margin-top: 16px; padding: 10px 22px; background: #b45309; color: #fff;
               border: none; border-radius: 8px; font-size: 14px; cursor: pointer; text-decoration: none; }
        .btn-block { display: block; width: 100%; text-align: center; }

        .empty-state { text-align: center; padding: 50px 20px; color: #6b7280; }
        .back-to-top {
            position: fixed; bottom: 20px; left: 20px; width: 44px; height: 44px; border-radius: 50%;
            background: #b45309; color: #fff; display: flex; align-items: center; justify-content: center;
            text-decoration: none; font-size: 18px; box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        footer { text-align: center; padding: 22px; color: #9ca3af; font-size: 12px; }
        footer a { color: #6b7280; }
        .messages { max-width: 680px; margin: 12px auto 0; padding: 0 20px; }
        .messages .msg {
            background: #ecfdf5; border: 1px solid #10b981; color: #065f46;
            padding: 10px 16px; border-radius: 8px; margin-bottom: 8px; font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="messages">
        {% for message in messages %}
            <div class="msg">{{ message }}</div>
        {% endfor %}
    </div>

    {% block content %}{% endblock %}

    <footer>
        ساخته‌شده با پلتفرم منوی دیجیتال
    </footer>
</body>
</html>
