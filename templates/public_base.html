<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}منوی دیجیتال{% endblock %}</title>
    {% block meta %}{% endblock %}
    <style>
        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: Tahoma, Arial, sans-serif;
            background: #f9fafb;
            margin: 0;
            color: #1f2937;
            -webkit-tap-highlight-color: transparent;
        }
        .menu-wrapper { max-width: 640px; margin: 0 auto; padding-bottom: 40px; }
        .cover {
            height: 160px;
            background: #111827 center/cover no-repeat;
            display: flex;
            align-items: flex-end;
        }
        .restaurant-header {
            padding: 16px 20px 20px;
            background: #fff;
            border-radius: 16px 16px 0 0;
            margin-top: -20px;
            position: relative;
        }
        .restaurant-header h1 { margin: 0 0 4px; font-size: 22px; }
        .restaurant-header .meta { color: #6b7280; font-size: 13px; }
        .restaurant-header .meta a { color: inherit; text-decoration: none; }
        .category-nav {
            position: sticky;
            top: 0;
            z-index: 10;
            background: #fff;
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 10px 20px;
            border-bottom: 1px solid #f1f5f9;
            /* اسکرول‌بار روی موبایل معمولاً مخفی می‌شود؛ برای ظاهر تمیزتر: */
            scrollbar-width: none;
        }
        .category-nav::-webkit-scrollbar { display: none; }
        .category-nav a {
            flex-shrink: 0;
            padding: 6px 14px;
            background: #f3f4f6;
            border-radius: 999px;
            color: #374151;
            text-decoration: none;
            font-size: 13px;
            white-space: nowrap;
        }
        .category-block { padding: 20px; scroll-margin-top: 56px; }
        .category-title {
            font-size: 17px;
            font-weight: 700;
            border-right: 4px solid #2563eb;
            padding-right: 10px;
            margin-bottom: 12px;
        }
        .product-card {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 12px 0;
            border-bottom: 1px solid #f1f5f9;
        }
        .product-thumb {
            width: 56px;
            height: 56px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        .product-card:last-child { border-bottom: none; }
        .product-name { font-weight: 600; font-size: 15px; }
        .product-desc { color: #6b7280; font-size: 13px; margin-top: 2px; }
        .product-price { white-space: nowrap; font-weight: 700; font-size: 14px; }
        .product-price .original { color: #9ca3af; text-decoration: line-through; font-weight: 400; font-size: 12px; margin-left: 6px; }
        .empty-state { text-align: center; padding: 60px 20px; color: #6b7280; }
        .back-to-top {
            position: fixed;
            bottom: 20px;
            left: 20px;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #2563eb;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }
        .gallery-strip {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 16px 20px 4px;
        }
        .gallery-strip img {
            width: 110px;
            height: 80px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }
        footer {
            text-align: center;
            padding: 24px;
            color: #9ca3af;
            font-size: 12px;
        }
        footer a { color: #6b7280; }
    </style>
</head>
<body>
    {% block content %}{% endblock %}

    <footer>
        ساخته‌شده با پلتفرم منوی دیجیتال
    </footer>
</body>
</html>
