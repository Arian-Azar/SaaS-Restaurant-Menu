{% extends 'base.html' %}
{% block title %}حذف آمار{% endblock %}
{% block content %}
<div class="container">
    <h1>حذف آمار</h1>
    <p>آیا از حذف «{{ object.label }}: {{ object.number }}» مطمئن هستید؟</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:#dc2626;">بله، حذف شود</button>
        <a class="btn" style="background:#6b7280;" href="{% url 'stat_list' %}">انصراف</a>
    </form>
</div>
{% endblock %}
