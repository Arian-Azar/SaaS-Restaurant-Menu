{% extends 'base.html' %}
{% block title %}حذف پست{% endblock %}
{% block content %}
<div class="container">
    <h1>حذف پست وبلاگ</h1>
    <p>آیا از حذف «{{ object.title }}» مطمئن هستید؟</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:#dc2626;">بله، حذف شود</button>
        <a class="btn" style="background:#6b7280;" href="{% url 'blog_list' %}">انصراف</a>
    </form>
</div>
{% endblock %}
