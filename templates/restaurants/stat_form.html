{% extends 'base.html' %}
{% block title %}افزودن آمار{% endblock %}
{% block content %}
<div class="container">
    <h1>افزودن آمار</h1>
    <form method="post" novalidate>
        {% csrf_token %}
        {% for field in form %}
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% if field.errors %}
                <ul class="errorlist">
                    {% for error in field.errors %}<li>{{ error }}</li>{% endfor %}
                </ul>
            {% endif %}
        {% endfor %}
        <button type="submit">ذخیره</button>
        <a class="btn" style="background:#6b7280;" href="{% url 'stat_list' %}">انصراف</a>
    </form>
</div>
{% endblock %}
