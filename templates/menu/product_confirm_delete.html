{% extends 'base.html' %}
{% block title %}حذف محصول{% endblock %}
{% block content %}
<div class="container">
    <h1>حذف محصول</h1>
    <p>آیا از حذف محصول «{{ object.name }}» مطمئن هستید؟</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:#dc2626;">بله، حذف شود</button>
        <a class="btn" style="background:#6b7280;" href="{% url 'menu:product_list' %}">انصراف</a>
    </form>
</div>
{% endblock %}
