{% extends 'base.html' %}
{% block title %}حذف دسته‌بندی{% endblock %}
{% block content %}
<div class="container">
    <h1>حذف دسته‌بندی</h1>
    <p>آیا از حذف دسته‌بندی «{{ object.name }}» مطمئن هستید؟</p>
    <p class="muted">توجه: با حذف این دسته‌بندی، محصولات وابسته به آن نیز حذف خواهند شد.</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" style="background:#dc2626;">بله، حذف شود</button>
        <a class="btn" style="background:#6b7280;" href="{% url 'menu:category_list' %}">انصراف</a>
    </form>
</div>
{% endblock %}
